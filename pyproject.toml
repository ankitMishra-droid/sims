[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = ["backend/app", "tests"]
project-excludes = ["**/.venv/**", "**/venv/**", "**/node_modules/**", "**/__pycache__/**"]
search-path = ["backend"]
python-interpreter-path = ".venv/Scripts/python.exe"
