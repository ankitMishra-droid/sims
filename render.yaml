services:
  - type: web
    name: stocksangati-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.db_migrate && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: APP_ENV
        value: production
      - key: SKIP_DB_MIGRATIONS
        value: "1"
